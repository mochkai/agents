# Agent farm settings (committed, non-secret). KEY=VALUE lines, comments on their own lines.
# Read by bin/lib/config.sh and bin/watch.js: only the keys below are used, and the file is parsed,
# never sourced. An environment variable with the same name overrides the value here.
# Secrets (email settings) belong in the git-ignored .env instead.

# Plan usage (see README: "Usage limits"). Percentages of the Claude plan's usage windows.
# Do not start new tasks once the 5-hour window reaches this percentage (0 disables the check).
USAGE_LIMIT_5H=75
# Do not start new tasks once the weekly (7-day) window reaches this percentage (0 disables the check).
USAGE_LIMIT_WEEK=90
# Seconds a cached reading (state/usage.json) is reused before bin/usage.sh probes again.
USAGE_MAX_AGE=600
